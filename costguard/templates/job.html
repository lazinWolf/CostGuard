{% extends "base.html" %}{% block title %}Job · CostGuard{% endblock %}
{% block content %}<h1>Experiment run</h1><div class="card"><p>Job <code>{{job.id}}</code></p><p>State: <span id="state" class="status {{job.state}}">{{job.state}}</span></p><p>Progress: <span id="progress">{{job.progress}} / {{job.total}}</span></p><p id="error" class="muted">{{job.error or ''}}</p><p id="result">{% if job.artifact_id %}<a href="/artifacts/{{job.artifact_id}}">View execution</a>{% endif %}</p><button onclick="cancelJob()">Cancel pending work</button></div>
<script>async function poll(){const r=await fetch('/api/v1/jobs/{{job.id}}');const j=await r.json();document.getElementById('state').textContent=j.state;document.getElementById('progress').textContent=j.progress+' / '+j.total;document.getElementById('error').textContent=j.error||'';if(j.artifact_id)document.getElementById('result').innerHTML='<a href="/artifacts/'+j.artifact_id+'">View execution</a>';if(['queued','running'].includes(j.state))setTimeout(poll,1500);}async function cancelJob(){await fetch('/api/v1/jobs/{{job.id}}/cancel',{method:'POST'});poll();}poll();</script>{% endblock %}
