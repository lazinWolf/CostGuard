{% extends "base.html" %}{% block title %}Scenarios · CostGuard{% endblock %}
{% block content %}<h1>Price and traffic scenarios</h1><p class="muted">Reprice a saved execution while keeping its observed behavior and usage fixed. This does not predict quality or latency changes.</p>
<div class="card"><label>Execution</label><select id="artifact">{% for a in artifacts %}<option value="{{a.id}}">{{a.name}} · {{a.id[:8]}}</option>{% endfor %}</select><label>Hypothetical pricing JSON</label><textarea id="pricing">{{pricing}}</textarea><label>Monthly requests</label><input id="traffic" type="number" min="0" value="100000"><p><button onclick="calculate()">Calculate scenario</button></p><pre id="result" hidden></pre></div>
<script>async function calculate(){const el=document.getElementById('result');try{const data={artifact_id:document.getElementById('artifact').value,pricing:JSON.parse(document.getElementById('pricing').value),monthly_requests:Number(document.getElementById('traffic').value)};const r=await fetch('/api/v1/scenarios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});el.textContent=JSON.stringify(await r.json(),null,2);}catch(e){el.textContent=e.message;}el.hidden=false;}</script>{% endblock %}
