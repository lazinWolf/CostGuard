<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CostGuard{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% set path = request.url.path %}
<header><div class="bar-inner">
  <a class="brand" href="/">Cost<span>Guard</span></a>
  <nav>
    <a href="/" {% if path == '/' or (path.startswith('/checks/') and path != '/checks/new') %}aria-current="page"{% endif %}>Checks</a>
    <a href="/checks/new" {% if path == '/checks/new' %}aria-current="page"{% endif %}>New check</a>
    <a href="/connections" {% if path == '/connections' %}aria-current="page"{% endif %}>Connections</a>
    <a href="/docs">API</a>
  </nav>
</div></header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
