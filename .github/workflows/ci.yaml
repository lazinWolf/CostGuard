name: CostGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build prototype image
        run: docker compose --profile demo build

      - name: Unit tests
        run: docker compose --profile demo run --rm --no-deps app python -m unittest discover -v

      - name: Start demo stack
        run: docker compose --profile demo up -d --wait

      - name: End-to-end integration
        run: docker compose --profile demo exec -T app python -m tests.e2e

      - name: Legacy comparison smoke check
        run: bash validate.sh

      - name: Logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose --profile demo down
