name: CostGuard CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t costguard-api:v1 .

    - name: Run Container
      run: docker run -d -p 8000:8000 --name test-service costguard-api:v1

    - name: Wait for API to initialize
      run: sleep 3

    - name: Run Bash Validation
      run: bash validate.sh
